<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Student Dashboard</title>
    <style>
        /* --- AJUSTES CRÍTICOS PARA WIX IFRAME --- */
        /* Asegura que el contenedor de desplazamiento sea el body/html y que cubra el 100% del iframe */
        html, body { 
            height: 100%; 
            min-height: 100vh; /* Agregado para navegadores modernos */
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            overflow-x: hidden; /* Evita scroll horizontal */
        }
        .main-wrapper {
            /* Contenedor que maneja el fondo y el scroll */
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif; 
            background: linear-gradient(135deg, #2c0439 0%, #1a0225 100%); 
            color: white; 
            padding: 15px; 
            min-height: 100%;
            width: 100%;
            position: relative; /* Base para el contenido */
            overflow-y: auto; /* Permite el scroll del contenido */
        }
        /* -------------------------------------- */

        * { box-sizing: border-box; }
        
        .container { max-width: 1000px; margin: 0 auto; }
        .header { text-align: center; padding: 20px; margin-bottom: 20px; background: linear-gradient(135deg, rgba(163, 127, 71, 0.15), rgba(163, 127, 71, 0.05)); border-radius: 15px; border: 1px solid rgba(163, 127, 71, 0.3); }
        .header h1 { font-size: 1.8rem; color: #d4af37; margin-bottom: 8px; }
        .header .quote { font-size: 0.9rem; color: rgba(255, 255, 255, 0.7); font-style: italic; }
        
        /* LOGIN CARD */
        .login-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 2px solid rgba(163, 127, 71, 0.3); border-radius: 15px; padding: 30px; max-width: 450px; margin: 30px auto; }
        .login-card h2 { color: #a37f47; margin-bottom: 20px; text-align: center; font-size: 1.5rem; }
        .lang-btn { padding: 8px 15px; background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(163, 127, 71, 0.3); border-radius: 8px; color: white; font-size: 0.9rem; cursor: pointer; transition: all 0.3s; }
        .lang-btn:hover { background: rgba(163, 127, 71, 0.2); }
        .lang-btn.active { background: linear-gradient(135deg, #a37f47, #d4af37); border-color: #d4af37; color: #2c0439; font-weight: bold; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 6px; color: rgba(255, 255, 255, 0.9); font-size: 0.9rem; }
        .form-group input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 2px solid rgba(163, 127, 71, 0.3); background: rgba(255, 255, 255, 0.05); color: white; font-size: 0.95rem; }
        .form-group input:focus { outline: none; border-color: #a37f47; }
        .btn-primary { width: 100%; padding: 12px; background: linear-gradient(135deg, #a37f47, #d4af37); border: none; border-radius: 8px; color: #2c0439; font-size: 1rem; font-weight: bold; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
        .btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 10px rgba(212, 175, 55, 0.4); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
        .error { background: rgba(255, 82, 82, 0.2); border: 1px solid rgba(255, 82, 82, 0.5); padding: 12px; border-radius: 8px; color: #ff5252; margin-top: 12px; font-size: 0.9rem; }
        
        /* DASHBOARD */
        .dashboard { display: none; }
        .dashboard.active { display: block; }
        .user-info { text-align: center; margin-bottom: 20px; padding: 20px; background: rgba(255, 255, 255, 0.03); border-radius: 10px; }
        .user-info h2 { color: #d4af37; font-size: 1.5rem; margin-bottom: 12px; }
        .user-info .welcome-msg { color: rgba(255, 255, 255, 0.85); font-size: 0.95rem; line-height: 1.5; margin-bottom: 8px; }
        .user-info .email { color: rgba(255, 255, 255, 0.5); font-size: 0.85rem; }
        
        .current-task { position: relative; background: linear-gradient(135deg, rgba(163, 127, 71, 0.25), rgba(163, 127, 71, 0.1)); border: 2px solid #d4af37; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(163, 127, 71, 0.2); }
        .current-task h3 { color: #d4af37; font-size: 1.3rem; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        
        /* Rich Text / Task Styling */
        .task-text { 
            font-size: 1.0rem; 
            line-height: 1.6; 
            color: white; 
            margin-bottom: 15px; 
            padding: 18px; 
            background: rgba(0, 0, 0, 0.25); 
            border-radius: 10px; 
            border-left: 4px solid #d4af37; 
            display: flex; 
            align-items: flex-start; 
            gap: 12px; 
            word-wrap: break-word;
        }
        .task-content { flex: 1; }
        /* CRÍTICO: Asegura que el rich text (con saltos de línea de Airtable/Sheets) se vea bien */
        .task-content h1, .task-content h2, .task-content h3, .task-content strong, .task-content b { color: #d4af37; font-weight: bold; }
        .task-content ul, .task-content ol { margin: 10px 0 10px 25px; padding: 0; }
        .task-content li { margin-bottom: 5px; }
        .task-content p { margin: 0 0 10px 0; white-space: pre-wrap; } /* Añadido pre-wrap para saltos de línea */

        .task-emoji { font-size: 2rem; flex-shrink: 0; }
        
        .btn-complete { width: 100%; padding: 14px; background: linear-gradient(135deg, #4CAF50, #45a049); border: none; border-radius: 8px; color: white; font-size: 1.05rem; font-weight: bold; cursor: pointer; transition: all 0.3s; }
        .btn-complete:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4); }
        .btn-complete:disabled { opacity: 0.6; cursor: not-allowed; }
        .no-tasks { text-align: center; padding: 25px; font-size: 1.1rem; }
        .no-tasks-icon { font-size: 2.5rem; margin-bottom: 10px; }
        
        /* Compact Stats */
        .compact-stats { 
            position: absolute; 
            top: 20px; 
            right: 20px; 
            display: flex; 
            gap: 15px; 
            z-index: 10;
        }
        .compact-stat-item { 
            text-align: right; 
            line-height: 1.2; 
        }
        .compact-stat-value { 
            font-size: 1.1rem; 
            font-weight: bold; 
            color: #d4af37; 
        }
        .compact-stat-label { 
            font-size: 0.65rem; 
            color: rgba(255, 255, 255, 0.6); 
            text-transform: uppercase;
        }
        
        /* Timeline */
        .section { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(163, 127, 71, 0.2); border-radius: 10px; padding: 15px; margin-bottom: 15px; }
        .section h3 { color: #a37f47; font-size: 1.1rem; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .horizontal-timeline { position: relative; padding: 30px 10px; overflow-x: auto; }
        .timeline-track { position: relative; display: flex; align-items: center; min-width: max-content; padding: 0 20px; }
        .timeline-line { position: absolute; left: 0; right: 0; height: 3px; background: linear-gradient(to right, #4CAF50, #d4af37); top: 50%; transform: translateY(-50%); }
        .timeline-items { display: flex; align-items: center; gap: 40px; position: relative; z-index: 1; }
        .h-timeline-item { display: flex; flex-direction: column; align-items: center; min-width: 100px; max-width: 150px; }
        .h-timeline-dot { width: 24px; height: 24px; border-radius: 50%; background: #4CAF50; display: flex; align-items: center; justify-content: center; font-size: 12px; box-shadow: 0 0 0 4px #1a0225, 0 0 10px rgba(76, 175, 80, 0.5); margin-bottom: 10px; color: white; font-weight: bold; }
        .h-timeline-text { font-size: 0.8rem; color: rgba(255, 255, 255, 0.7); text-align: center; max-width: 100%; line-height: 1.3; }
        .timeline-goal { display: flex; flex-direction: column; align-items: center; position: absolute; right: -50px; }
        .timeline-goal-star { width: 40px; height: 40px; background: linear-gradient(135deg, #d4af37, #a37f47); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; box-shadow: 0 0 0 4px #1a0225, 0 0 20px rgba(212, 175, 55, 0.6); margin-bottom: 10px; color: #2c0439; }
        .timeline-goal-text { font-size: 0.85rem; color: #d4af37; text-align: center; max-width: 150px; font-weight: bold; line-height: 1.3; }
        
        .stats-grid { display: none; } 

        /* Media Query: Móvil */
        @media (max-width: 768px) { 
            .compact-stats { 
                position: static; /* Quita la posición absoluta en móvil */
                margin-top: -15px; /* Sube un poco para compensar */
                margin-bottom: 15px; 
                justify-content: space-around; 
                gap: 10px; 
                padding: 5px 0;
            }
            .compact-stat-item { text-align: center; }
            .compact-stat-value { font-size: 1.0rem; }
            .compact-stat-label { font-size: 0.6rem; }
            .header h1 { font-size: 1.5rem; } 
            .task-text { font-size: 0.95rem; }
            .task-emoji { font-size: 1.8rem; }
        }
    </style>
</head>
<body>
    <div class="main-wrapper"> <div class="container">
            <div class="header">
                <h1 id="headerTitle">✨ My Student Dashboard</h1>
                <p class="quote" id="dailyQuote"></p>
            </div>
            <div class="login-card" id="loginCard">
                <h2 id="loginTitle">Welcome</h2>
                <div style="display: flex; gap: 8px; justify-content: center; margin-bottom: 20px;">
                    <button onclick="changeLanguage('en')" class="lang-btn" id="lang-en">🇺🇸 EN</button>
                    <button onclick="changeLanguage('es')" class="lang-btn" id="lang-es">🇪🇸 ES</button>
                    <button onclick="changeLanguage('pt')" class="lang-btn" id="lang-pt">🇧🇷 PT</button>
                </div>
                <p style="text-align: center; margin-bottom: 15px; color: rgba(255,255,255,0.8); font-size: 0.95rem;" id="loginInstructions"></p>
                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="email" id="emailLabel">Your Email</label>
                        <input type="email" id="email" placeholder="your.email@example.com" required>
                    </div>
                    <button type="submit" class="btn-primary" id="loginBtn">Iniciar Sesión</button>
                </form>
                <div id="loginError" class="error" style="display: none;"></div>
            </div>
            <div class="dashboard" id="dashboard">
                <div class="user-info">
                    <h2 id="dashboardGreeting">¡Hola! 👋</h2>
                    <div class="welcome-msg" id="welcomeMessage"></div>
                    <div class="email" id="userEmail"></div>
                </div>
                
                <div id="currentTaskSection"></div>

                <div class="section">
                    <h3 id="timelineTitle">🎯 Tu Camino</h3>
                    <div class="horizontal-timeline">
                        <div class="timeline-track">
                            <div class="timeline-line"></div>
                            <div class="timeline-items" id="timelineItems">
                                </div>
                        </div>
                    </div>
                </div>

                <div id="objectiveContainer" style="margin-top: 15px;">
                    <h3 style="color: #d4af37; font-size: 1rem; margin-bottom: 5px;" id="objectiveLabel">⭐ Objetivo:</h3>
                    <p id="studentObjective" style="font-size: 0.95rem; line-height: 1.5; padding: 10px; background: rgba(163, 127, 71, 0.1); border-radius: 8px;"></p>
                </div>

            </div>
        </div>
    </div>
    <script>
        // --- CRÍTICO: REEMPLAZA ESTA URL CON LA URL DE TU APPS SCRIPT DESPLEGADA ---
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz_sOP4ZqTtI7jy4B2lOH7TIqAKSDPiE0Q34CRRY8eP10r33ejiRI3lxjtcjvXgQJq3WQ/exec'; 

        const translations = {en:{title:"My Student Dashboard",loginTitle:"Welcome",loginInstructions:"Enter your email to receive your personalized task",emailLabel:"Your Email",signInBtn:"Sign In",loadingBtn:"Loading...",dashboardGreeting:"Hello! 👋",welcomeMessage:"This is your task for today. If you have questions about what to do or need any assistance, you can send a message through private chat and Coach Laura will respond as soon as possible!",currentTaskTitle:"📝 Your Current Task",completeBtn:"✓ Mark as Completed",updatingBtn:"⏳ Updating...",noTasksIcon:"🎉",noTasksText:"All caught up! No pending tasks.",statCompleted:"Completed",statTotal:"Total",statProgress:"Progress",timelineTitle:"🎯 Your Journey",objectiveLabel:"⭐ Objective:",errorNoData:"No data found. Please check your email.",errorConnection:"Connection error. Please try again later.",errorUpdate:"Error: "},es:{title:"Mi Panel de Estudiante",loginTitle:"Bienvenido",loginInstructions:"Escribe tu email para recibir tu tarea personalizada",emailLabel:"Tu Email",signInBtn:"Iniciar Sesión",loadingBtn:"Cargando...",dashboardGreeting:"¡Hola! 👋",welcomeMessage:"Esta es tu tarea de hoy. Si tienes dudas sobre lo que debes hacer o necesitas cualquier asistencia, puedes enviar un mensaje por el chat privado y Coach Laura te responderá cuanto antes!",currentTaskTitle:"📝 Tu Tarea Actual",completeBtn:"✓ Marcar como Completada",updatingBtn:"⏳ Actualizando...",noTasksIcon:"🎉",noTasksText:"¡Todo al día! No hay tareas pendientes.",statCompleted:"Completadas",statTotal:"Total",statProgress:"Progreso",timelineTitle:"🎯 Tu Camino",objectiveLabel:"⭐ Objetivo:",errorNoData:"No se encontraron datos. Por favor verifica tu email.",errorConnection:"Error de conexión. Inténtalo más tarde.",errorUpdate:"Error: "},pt:{title:"Meu Painel de Estudante",loginTitle:"Bem-vindo",loginInstructions:"Digite seu email para receber sua tarefa personalizada",emailLabel:"Seu Email",signInBtn:"Entrar",loadingBtn:"Carregando...",dashboardGreeting:"Olá! 👋",welcomeMessage:"Esta é sua tarefa de hoje. Se tiver dúvidas sobre o que fazer ou precisar de assistência, pode enviar uma mensagem pelo chat privado e a Coach Laura responderá o mais breve possível!",currentTaskTitle:"📝 Sua Tarefa Atual",completeBtn:"✓ Marcar como Concluída",updatingBtn:"⏳ Atualizando...",noTasksIcon:"🎉",noTasksText:"Tudo em dia! Sem tarefas pendentes.",statCompleted:"Concluídas",statTotal:"Total",statProgress:"Progresso",timelineTitle:"🎯 Sua Jornada",objectiveLabel:"⭐ Objetivo:",errorNoData:"Nenhum dado encontrado. Verifique seu email.",errorConnection:"Erro de conexão. Tente novamente mais tarde.",errorUpdate:"Error: "}};
        const quotes = {en:["Learning is a treasure that will follow its owner everywhere.","Education is the passport to the future.","The expert in anything was once a beginner.","A journey of a thousand miles begins with a single step.","Knowledge is power. Information is liberating.","The only way to do great work is to love what you do.","Learning never exhausts the mind.","An investment in knowledge pays the best interest."],es:["El aprendizaje es un tesoro que seguirá a su dueño a todas partes.","La educación es el pasaporte hacia el futuro.","El experto en cualquier cosa fue una vez un principiante.","Un viaje de mil millas comienza con un solo paso.","El conocimiento es poder. La información es liberadora.","La única forma de hacer un gran trabajo es amar lo que haces.","El aprendizaje nunca agota la mente.","Una inversión en conocimiento paga el mejor interés."],pt:["O aprendizado é um tesouro que seguirá seu dono em todos os lugares.","A educação é o passaporte para o futuro.","O especialista em qualquer coisa já foi um iniciante.","Uma jornada de mil milhas começa com um único passo.","Conhecimento é poder. Informação é libertadora.","A única forma de fazer um grande trabalho é amar o que você faz.","O aprendizado nunca esgota a mente.","Uma investimento em conhecimento paga o melhor interesse."]};
        let currentUser = null, userData = null, currentLanguage = 'es';

        function init() {
            const savedLanguage = localStorage.getItem('preferredLanguage') || 'es';
            changeLanguage(savedLanguage);
            const savedEmail = localStorage.getItem('studentEmail');
            if (savedEmail) {
                document.getElementById('email').value = savedEmail;
            }
        }

        function changeLanguage(lang) {
            currentLanguage = lang;
            localStorage.setItem('preferredLanguage', lang);
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('lang-' + lang).classList.add('active');
            const t = translations[lang];

            document.getElementById('headerTitle').textContent = '✨ ' + t.title;
            document.getElementById('loginTitle').textContent = t.loginTitle;
            document.getElementById('loginInstructions').textContent = t.loginInstructions;
            document.getElementById('emailLabel').textContent = t.emailLabel;
            document.getElementById('loginBtn').textContent = t.signInBtn;
            document.getElementById('objectiveLabel').textContent = t.objectiveLabel;

            const dailyQuote = getDailyQuote(lang);
            document.getElementById('dailyQuote').textContent = '"' + dailyQuote + '"';

            if (userData) updateDashboardLanguage();
        }

        function getDailyQuote(lang) {
            const today = new Date();
            const dayOfYear = Math.floor((today - new Date(today.getFullYear(), 0, 0)) / 86400000);
            return quotes[lang][dayOfYear % quotes[lang].length];
        }

        function updateDashboardLanguage() {
            const t = translations[currentLanguage];
            document.getElementById('dashboardGreeting').textContent = t.dashboardGreeting;
            document.getElementById('welcomeMessage').textContent = t.welcomeMessage;
            document.getElementById('timelineTitle').textContent = t.timelineTitle;
            renderCurrentTask();
            renderTimeline();
            renderStats();
            renderObjective();
        }

        function getTaskEmoji(taskText) {
            const text = taskText.toLowerCase();
            const emojiMap = {'read':'📚','leer':'📚','ler':'📚','write':'✍️','escribir':'✍️','escrever':'✍️','video':'🎥','vídeo':'🎥','study':'📖','estudiar':'📖','estudar':'📖','practice':'💪','practicar':'💪','praticar':'💪','exercise':'🏃','ejercicio':'🏃','exercício':'🏃','test':'📝','examen':'📝','teste':'📝','project':'🎯','proyecto':'🎯','projeto':'🎯','research':'🔍','investigar':'🔍','pesquisar':'🔍','present':'🎤','presentar':'🎤','apresentar':'🎤','code':'💻','programar':'💻','programação':'💻','design':'🎨','diseñar':'🎨','desenhar':'🎨','create':'✨','crear':'✨','criar':'✨','review':'👀','revisar':'👀','listen':'🎧','escuchar':'🎧','ouvir':'🎧','watch':'👁️','ver':'👁️','assistir':'👁️'};
            for (const [keyword, emoji] of Object.entries(emojiMap)) {
                if (text.includes(keyword)) return emoji;
            }
            return '📌';
        }

        async function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('email').value.trim();
            if (!email) return;

            const t = translations[currentLanguage];
            document.getElementById('loginBtn').disabled = true;
            document.getElementById('loginBtn').textContent = t.loadingBtn;
            document.getElementById('loginError').style.display = 'none';

            await loadStudentData(email);
        }

        // Llama al doGet del GAS para leer la última fila del Sheet
        async function loadStudentData(email) {
            const t = translations[currentLanguage];
            try {
                const url = APPS_SCRIPT_URL + '?action=getStudentData&email=' + encodeURIComponent(email);
                const response = await fetch(url);
                const data = await response.json();

                if (data.success) {
                    currentUser = email;
                    userData = data;
                    
                    localStorage.setItem('studentEmail', email);
                    showDashboard();
                } else {
                    showError(data.error || t.errorNoData);
                }
            } catch (error) {
                console.error('Error:', error);
                showError(t.errorConnection);
            } finally {
                document.getElementById('loginBtn').disabled = false;
                document.getElementById('loginBtn').textContent = t.signInBtn;
            }
        }

        function showError(message) {
            const errorDiv = document.getElementById('loginError');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        function showDashboard() {
            document.getElementById('loginCard').style.display = 'none';
            document.getElementById('dashboard').classList.add('active');
            document.getElementById('userEmail').textContent = currentUser;

            updateDashboardLanguage();
        }

        function renderStats() {
            const t = translations[currentLanguage];
            const progressPct = userData.totalTasks > 0 ? Math.round((userData.completedCount / userData.totalTasks) * 100) : 0;

            const statsHTML = `
                <div class="compact-stat-item">
                    <div class="compact-stat-value">${userData.completedCount}</div>
                    <div class="compact-stat-label">${t.statCompleted}</div>
                </div>
                <div class="compact-stat-item">
                    <div class="compact-stat-value">${userData.totalTasks}</div>
                    <div class="compact-stat-label">${t.statTotal}</div>
                </div>
                <div class="compact-stat-item">
                    <div class="compact-stat-value">${progressPct}%</div>
                    <div class="compact-stat-label">${t.statProgress}</div>
                </div>
            `;
            
            const taskSection = document.getElementById('currentTaskSection');
            taskSection.querySelectorAll('.compact-stats').forEach(el => el.remove()); 

            if (taskSection.querySelector('.current-task')) {
                taskSection.querySelector('.current-task').insertAdjacentHTML('afterbegin', `<div class="compact-stats">${statsHTML}</div>`);
            }
        }

        function renderCurrentTask() {
            const section = document.getElementById('currentTaskSection');
            const t = translations[currentLanguage];

            const currentTaskData = userData.currentTask;

            // La corrección crítica anterior de Tarea_Actual se mantiene
            if (currentTaskData && currentTaskData.Tarea_Actual) { 
                const task = currentTaskData;
                const emoji = getTaskEmoji(task.Tarea_Actual);
                
                section.innerHTML = `
                    <div class="current-task">
                        <h3>${t.currentTaskTitle}</h3>
                        <div class="task-text">
                            <div class="task-emoji">${emoji}</div>
                            <div class="task-content">${task.Tarea_Actual}</div>
                        </div>
                        <button class="btn-complete" onclick="completeTask(event, '${currentUser}', '${task.ID}')">${t.completeBtn}</button>
                    </div>
                `;
            } else {
                section.innerHTML = `
                    <div class="current-task">
                        <div class="no-tasks">
                            <div class="no-tasks-icon">${t.noTasksIcon}</div>
                            <div>${t.noTasksText}</div>
                        </div>
                    </div>
                `;
            }
        }

        function renderTimeline() {
            const container = document.getElementById('timelineItems');
            const goalText = userData.objetivo || translations[currentLanguage].timelineTitle;
            
            if (!userData.completedTasks || userData.completedTasks.length === 0) {
                container.innerHTML = `
                    <div class="timeline-goal" style="position: static;">
                        <div class="timeline-goal-star">⭐</div>
                    </div>
                `;
                document.querySelector('.timeline-line').style.background = '#d4af37';
                document.querySelector('.timeline-track').style.justifyContent = 'center';
                return;
            }

            const recentTasks = userData.completedTasks.slice(-3);
            
            const tasksHTML = recentTasks.map(task => `
                <div class="h-timeline-item">
                    <div class="h-timeline-dot">✓</div>
                    <div class="h-timeline-text">${task.tarea.substring(0, 40) + (task.tarea.length > 40 ? '...' : '')}</div>
                </div>
            `).join('');

            container.innerHTML = tasksHTML + `
                <div style="width: 20px;"></div>
                <div class="timeline-goal" style="position: static;">
                    <div class="timeline-goal-star">⭐</div>
                </div>
            `;
            document.querySelector('.timeline-line').style.background = 'linear-gradient(to right, #4CAF50, #d4af37)';
            document.querySelector('.timeline-track').style.justifyContent = 'flex-start';
        }

        function renderObjective() {
            const objectiveEl = document.getElementById('studentObjective');
            const objectiveContainer = document.getElementById('objectiveContainer');
            
            if (userData.objetivo) {
                objectiveEl.textContent = userData.objetivo;
                objectiveContainer.style.display = 'block';
            } else {
                objectiveEl.textContent = 'Aún no hay un objetivo definido.';
                objectiveContainer.style.display = 'block'; 
            }
        }
        
        // --- FUNCIÓN QUE ENVÍA LA ACCIÓN AL doPost DEL GAS (Implementa la Cascada Visual) ---
        // Acepta 'event' como primer argumento para asegurar compatibilidad con onclick
        async function completeTask(event, email, recordID) {
            const btn = event.target; // Usamos event.target para obtener el botón
            const t = translations[currentLanguage];
            
            btn.disabled = true;
            btn.textContent = t.updatingBtn;
            
            const currentTaskSection = document.getElementById('currentTaskSection');
            const oldTaskHTML = currentTaskSection.innerHTML;
            
            const nextTaskContent = userData.currentTask.Prox_Tarea; 
            
            if (nextTaskContent) {
                // 1. CASCADA DE VISTA INMEDIATA (FRONT-END)
                const nextEmoji = getTaskEmoji(nextTaskContent);
                // Extraer los stats del HTML anterior para reinsertarlos
                const statsMatch = oldTaskHTML.match(/<div class="compact-stats">[\s\S]*?<\/div>/);
                const statsHTML = statsMatch ? statsMatch[0] : '';

                currentTaskSection.innerHTML = `
                    <div class="current-task">
                        ${statsHTML}
                        <h3>${t.currentTaskTitle}</h3>
                        <div class="task-text">
                            <div class="task-emoji">${nextEmoji}</div>
                            <div class="task-content">${nextTaskContent}</div>
                        </div>
                        <p style="text-align: center; color: #4CAF50; font-weight: bold; margin-top: 10px;">¡Tarea completada! Tu próxima tarea ya está aquí.</p>
                    </div>
                `;
            } else {
                // Muestra el mensaje de 'actualizando' o 'no tasks' si no hay una próxima tarea
                currentTaskSection.innerHTML = `<div class="current-task"><div class="no-tasks"><div class="no-tasks-icon">🔄</div><div>${t.updatingBtn}</div></div></div>`;
            }

            try {
                // 2. Petición POST al Apps Script (doPost) para la actualización REAL (BACK-END)
                const response = await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    headers: {
                        // 💡 CORRECCIÓN CRÍTICA: El Content-Type debe ser application/json
                        'Content-Type': 'application/json' 
                    },
                    body: JSON.stringify({
                        action: 'triggerAirtableWebhook', 
                        email: email,
                        recordID: recordID // ID de Airtable para el GAS/Webhook
                    })
                });

                const result = await response.json();

                if (result.success) {
                    
                    // 3. Esperamos 3 segundos para que Airtable complete la cascada y la nueva fila en el Sheet
                    setTimeout(() => {
                        loadStudentData(currentUser); // Recarga (llama a doGet)
                    }, 3000); 

                } else {
                    throw new Error(result.error || "Error desconocido en el GAS.");
                }

            } catch (error) {
                console.error('Error en completación:', error);
                alert(t.errorUpdate + "No se pudo actualizar la tarea: " + error.message);
                
                // Revertir el estado de la tarea en caso de fallo
                currentTaskSection.innerHTML = oldTaskHTML; 
                // Necesitamos recrear el botón para habilitarlo
                const completeBtn = currentTaskSection.querySelector('.btn-complete');
                if (completeBtn) {
                     completeBtn.disabled = false;
                     completeBtn.textContent = t.completeBtn;
                }
            }
        }

        // 💡 Corrección de la llamada en renderCurrentTask para pasar el objeto event
        // NOTA: Esta línea DEBE SER EDITADA MANUALMENTE EN EL STRING DENTRO DE renderCurrentTask
        // `onclick="completeTask(event, '${currentUser}', '${task.ID}')"`
        
        window.addEventListener('load', init);
    </script>
</body>
